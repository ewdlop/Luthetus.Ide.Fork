# GitHub Milestones Configuration
# This file defines milestones for project planning and releases

milestones:
  - title: "v1.0.0 - Initial Stable Release"
    description: |
      First stable production release of Luthetus.Ide
      
      Goals:
      - Core IDE functionality stable on all platforms (Linux, Windows, Mac, WASM)
      - C# parser and compiler services fully functional
      - Text editor with syntax highlighting and basic features
      - File system navigation and management
      - Terminal integration
      - Basic debugging support
    state: open

  - title: "v0.10.0 - Beta Improvements"
    description: |
      Beta release focused on stability and performance
      
      Goals:
      - Performance optimizations for large files
      - Memory usage improvements
      - Bug fixes from beta testing
      - Additional language support improvements
      - Enhanced UI/UX
    state: open

  - title: "v0.11.0 - Extended Language Support"
    description: |
      Expand language support beyond C#
      
      Goals:
      - Enhanced Python support
      - Improved JavaScript/TypeScript support
      - F# parser improvements
      - Better Razor support
      - Multi-language project support
    state: open

  - title: "v0.12.0 - Developer Experience"
    description: |
      Improve developer productivity features
      
      Goals:
      - Code completion and IntelliSense
      - Refactoring tools
      - Code navigation (Go to Definition, Find References)
      - Better debugging experience
      - Integrated testing support
    state: open

  - title: "v0.13.0 - Collaboration Features"
    description: |
      Features to support team collaboration
      
      Goals:
      - Git integration improvements
      - Code review tools
      - Shared settings and configurations
      - Extension marketplace foundation
      - Plugin API
    state: open

  - title: "Backlog"
    description: |
      Features and improvements planned for future releases
      
      This milestone contains items that are planned but not yet assigned to a specific release.
    state: open

  - title: "Community Contributions"
    description: |
      Issues suitable for community contributions
      
      This milestone highlights issues that are good for external contributors and first-time contributors.
    state: open
